plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.15'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.mopl'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.retry:spring-retry'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.kafka:spring-kafka'
	implementation 'org.apache.kafka:kafka-clients'
	implementation 'com.github.ben-manes.caffeine:caffeine'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	//mapstruct 관련 의존성 추가
	implementation 'org.mapstruct:mapstruct:1.6.2'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'

	//QueryDSL
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	// jwt (JWT 파싱/발급)
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
	//Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.passay:passay:1.6.4'
	//s3
	implementation 'software.amazon.awssdk:s3:2.25.0'

	// OpenSearch
	implementation "org.opensearch.client:opensearch-java:2.19.0"
	implementation "org.apache.httpcomponents.client5:httpclient5:5.4.1"
	implementation "org.apache.httpcomponents.core5:httpcore5:5.3.1"
	implementation "org.apache.httpcomponents.core5:httpcore5-h2:5.3.1"

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.awaitility:awaitility:4.2.0'
}


configurations.all {
	resolutionStrategy {
		force "org.apache.httpcomponents.client5:httpclient5:5.4.1"
		force "org.apache.httpcomponents.core5:httpcore5:5.3.1"
		force "org.apache.httpcomponents.core5:httpcore5-h2:5.3.1"
	}
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
	exclude '**/MoplApplicationTests.class'
}

jacoco {
	toolVersion = "0.8.11"
}

// QueryDSL(Q*)/MapStruct(*MapperImpl) 생성 코드는 손으로 짠 로직이 없어 테스트 대상이 아님 -
// 커버리지 계산 제외 대상 (프로젝트 전체 도메인에 공통 적용)
def excludePatterns = [
		"**/Q*.class",
		"**/*MapperImpl*.class",
		"**/*Application*.class",
		"**/*Config*.class",
		"**/*Dto*.class",
		"**/*Request*.class",
		"**/*Response*.class",
		"**/**Builder*.class"
]

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = true
	}

	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: excludePatterns)
		}))
	}
	doLast {
		println "--------------------------------------------------------"
		println "★ JaCoCo Test Coverage Report Link:"
		println "file://${buildDir}/reports/jacoco/test/html/index.html"
		println "--------------------------------------------------------"
	}
}