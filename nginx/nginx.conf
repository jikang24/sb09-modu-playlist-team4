events {}

http {

    server {

        listen 80;

        # upstream{} 블록 + 호스트명 방식은 nginx가 워커 시작 시점에 DNS를 딱 한 번만
        # resolve해서 캐싱한다. ALB의 실제 IP는 AWS가 내부적으로 재할당/로테이션할 수 있어서
        # 재시작 없이 오래 떠 있으면 예전에 캐싱한 IP가 남의 리소스로 넘어가 있을 수 있다
        # (실제로 7일간 무재시작 상태에서 이 문제로 장애 발생함).
        # resolver + 변수를 쓰면 nginx가 valid에 지정한 주기마다 DNS를 다시 조회한다.
        resolver 8.8.8.8 valid=10s;
        set $backend_upstream modu-playlist-alb-1978007174.ap-northeast-2.elb.amazonaws.com:8080;

        location = /healthz {
            return 200 'ok';
        }

        location /api/sse {
            proxy_pass http://$backend_upstream;
            include proxy_headers.conf;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        location / {
            proxy_pass http://$backend_upstream;
            include proxy_headers.conf;
        }

        location /ws {
            proxy_pass http://$backend_upstream;
            include proxy_headers.conf;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

    }

}