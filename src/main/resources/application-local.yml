spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mopl
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create   # 로컬에서만 create, 운영은 none
    show-sql: true
    properties:
      hibernate:
        format_sql: true  # SQL 로그 보기 좋게 출력

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

  batch:
    job:
      enabled: false  # 서버 시작 시 배치 자동 실행 방지
    jdbc:
      initialize-schema: always