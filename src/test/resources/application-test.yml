spring:
  datasource:
    url: jdbc:h2:mem:notification-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: localhost:9092
  autoconfigure:
    exclude:

org:
  springframework:
    boot:
      autoconfigure:
        kafka:
          KafkaAutoConfiguration:

        data:
          redis:
            RedisAutoConfiguration:

        mail:
          MailSenderAutoConfiguration:

mopl:
  jwt:
    secret: test-secret-key-for-notification-repository-test-minimum-256-bits-long
    access-token-expiry-ms: 1800000
    refresh-token-expiry-ms: 604800000